<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved === 'dark' || saved === 'light'
        ? saved
        : (systemDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="container header__inner">
        <a class="logo header__logo" href="index.html" aria-label="Resource Coffee House — home page">
          <img class="logo__image logo__image--light" src="assets/images/logo.svg" alt="" width="100" height="60" />
          <img class="logo__image logo__image--dark" src="assets/images/logo-dark.svg" alt="" width="100" height="60" />
        </a>

        <nav class="header__nav" id="site-nav">
          <ul class="header__list">
            <li class="header__item">
              <a class="header__link" href="#favorite-coffee">Favorite coffee</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="#about">About</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="#mobile-app">Mobile app</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="#contacts">Contact us</a>
            </li>
          </ul>
        </nav>

        <div class="header__controls">

          <button type="button" class="theme-switch" aria-label="Switch theme" data-theme-button>
            <div class="theme-switch__icon theme-switch__icon--light">
              <span class="icon icon--sun" aria-hidden="true"></span>
            </div>
            <div class="theme-switch__icon theme-switch__icon--dark">
              <span class="icon icon--moon" aria-hidden="true"></span>
            </div>
          </button>

          <a class="header__menu-link" href="catalog.html">
            Menu
            <span class="icon icon--coffeecup" aria-hidden="true"></span>
          </a>

          <button type="button" class="burger" data-burger aria-expanded="false" aria-controls="site-nav"
            aria-label="Open menu">
            <span class="burger__line burger__line--top" aria-hidden="true"></span>
            <span class="burger__line burger__line--bottom" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
