<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House — Menu</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved === 'dark' || saved === 'light'
        ? saved
        : (systemDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="container header__inner">
        <a class="logo header__logo" href="index.html" aria-label="Resource Coffee House — home page">
          <img class="logo__image logo__image--light" src="assets/images/logo.svg" alt="" width="100" height="60">
          <img class="logo__image logo__image--dark" src="assets/images/logo-dark.svg" alt="" width="100" height="60">
        </a>

        <nav class="header__nav" id="site-nav" data-nav>
          <ul class="header__list">
            <li class="header__item">
              <a class="header__link" href="index.html#favorite-coffee">Favorite coffee</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#about">About</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#mobile-app">Mobile app</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="#contacts">Contact us</a>
            </li>
            <li class="header__item header__item--tablet-only">
              <a class="header__link" href="catalog.html">Menu
                <span class="icon icon--coffeecup2" aria-hidden="true"></span></a>
            </li>
          </ul>
        </nav>

        <div class="header__controls">

          <button type="button" class="theme-switch" aria-label="Switch theme" data-theme-button>
            <span class="theme-switch__icon theme-switch__icon--light">
              <span class="icon icon--sun" aria-hidden="true"></span>
            </span>
            <span class="theme-switch__icon theme-switch__icon--dark">
              <span class="icon icon--moon" aria-hidden="true"></span>
            </span>
          </button>

          <a class="header__menu-link header__menu-link--current" href="catalog.html">
            Menu
            <span class="icon icon--coffeecup" aria-hidden="true"></span>
          </a>

          <button type="button" class="burger" data-burger aria-expanded="false" aria-controls="site-nav"
            aria-label="Open menu">
            <span class="burger__line burger__line--top" aria-hidden="true"></span>
            <span class="burger__line burger__line--bottom" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="page__main">
      <section class="catalog" id="menu" aria-labelledby="catalog-title">
        <div class="container catalog__container">
          <div class="catalog__head">
            <h1 id="catalog-title" class="title title--center catalog__title">
              Behind each of our cups hides an <em class="title__accent">amazing surprise</em>
            </h1>

            <div class="catalog__tabs" role="group" aria-label="Menu categories">
              <button type="button" class="pill catalog__tab pill--active" aria-pressed="true" data-catalog-tab
                data-category="coffee">
                <span class="pill__mark" aria-hidden="true">☕</span>Coffee
              </button>

              <button type="button" class="pill catalog__tab" aria-pressed="false" data-catalog-tab data-category="tea">
                <span class="pill__mark" aria-hidden="true">🍵</span>Tea
              </button>

              <button type="button" class="pill catalog__tab" aria-pressed="false" data-catalog-tab
                data-category="dessert">
                <span class="pill__mark" aria-hidden="true">🍰</span>Dessert
              </button>
            </div>
          </div>

          <ul class="catalog__list" data-catalog-list></ul>
          <p class="catalog__empty" role="status" hidden data-catalog-empty>No items in this category yet.</p>
          <button type="button" class="round-button catalog__more" aria-label="Show more items">
            <span class="icon icon--refresh" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer" id="contacts">
      <div class="container">
        <div class="footer__panel">
          <div class="footer__column">
            <h2 class="title title--light">
              Sip, Savor, Smile.<br><em class="title__accent">It’s coffee time!</em>
            </h2>
            <div class="socials">
              <a class="socials__link" href="https://x.com/" aria-label="Twitter" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon--twitter" aria-hidden="true"></span>
              </a>
              <a class="socials__link" href="https://www.instagram.com/" aria-label="Instagram" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon--instagram" aria-hidden="true"></span>
              </a>
              <a class="socials__link" href="https://www.facebook.com/" aria-label="Facebook" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon--facebook" aria-hidden="true"></span>
              </a>
            </div>
          </div>

          <div class="footer__column">
            <h2 class="footer__subtitle">Contact us</h2>
            <address class="footer__list">
              <a class="footer__link" href="https://maps.google.com/?q=8558+Green+Rd.,+LA" target="_blank"
                rel="noopener noreferrer">
                <span class="icon icon--pinalt" aria-hidden="true"></span>8558 Green Rd., LA
              </a>
              <a class="footer__link" href="tel:+16035550123">
                <span class="icon icon--phone" aria-hidden="true"></span>+1 (603) 555-0123
              </a>
              <p class="footer__item">
                <span class="icon icon--clock" aria-hidden="true"></span>Mon–Sat: 9:00–23:00
              </p>
            </address>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
